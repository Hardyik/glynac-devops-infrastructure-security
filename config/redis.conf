
# Network security
bind 0.0.0.0
protected-mode yes
port 6379

# Authentication and access control
aclfile /usr/local/etc/redis/users.acl

# Connection settings
maxclients 100
timeout 300

# Resource protection
maxmemory 128mb
maxmemory-policy noeviction

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# Logging
loglevel notice
