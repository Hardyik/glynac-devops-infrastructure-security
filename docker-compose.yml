services:
  redis:
    image: redis:7-alpine
    container_name: redis-dev587
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./config/users.acl:/usr/local/etc/redis/users.acl:ro
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge